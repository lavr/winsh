name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make check integration
      - run: make cross-build
  ntlm-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pyspnego==0.12.2
      - run: make build
      - run: python scripts/ntlm-smoke.py
      - run: WINSH_TEST_PYSPNEGO=1 go test ./internal/remote -run '^Test(Persistent|RunWithPosters|TransferLanes)PyspnegoInterop$' -count=1
      - run: python scripts/control-smoke.py
  platforms:
    strategy:
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -timeout=90s ./...
